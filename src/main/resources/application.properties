spring.application.name=demo-planogram-service

server.servlet.context-path=/api/planogram
server.port=8002

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/demo_planogram_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Kafka Consumer Configuration (planogram-service is strictly a consumer)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=planogram-service-group
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8081
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.listener.ack-mode=MANUAL

# Swagger / OpenAPI 3.0 Documentation Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

# Logging Configuration
logging.level.com.demo.planogramservice.events=DEBUG
logging.level.org.apache.kafka.streams=INFO
logging.level.org.springframework.kafka.config.StreamsBuilderFactoryBean=DEBUG
